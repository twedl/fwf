[package]
name = "fwf"
version = "0.1.0"
edition = "2024"
description = "Read fixed-width files into Arrow record batches, and write them as CSV or Parquet"

[dependencies]
arrow-array = "60.0.0"
arrow-csv = "60.0.0"
arrow-schema = "60.0.0"
arrow-select = "60.0.0"
bytes = "1.12.1"
crc32fast = "1.5.2"
deflate64 = "0.1.12"
flate2 = "1.1.10"
memchr = "2.8.3"
memmap2 = "0.9.11"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
zip = { version = "8.6.0", default-features = false }
