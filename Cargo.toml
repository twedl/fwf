[package]
name = "fwf"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.104"
# Date fields are parsed with chrono's own strftime formats, which is what makes
# a schema's `format` mean to this tool what it means to polars' `to_date`.
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
# Pinned to 0.53: the row-group and string-slicing behaviour the README documents
# was verified against this version's source. Re-check those notes before moving.
# `dtype-date` is what makes `DataType::Date` usable rather than a variant that
# panics on first use — polars gates the logical type, not the enum.
polars = { version = "0.53", default-features = false, features = ["parquet", "dtype-date"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
zip = "8.6.0"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
# Nothing here: test targets already see the regular [dependencies], and a second
# copy of a version pin could silently drift from the one the binary builds with.
