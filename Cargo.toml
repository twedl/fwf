[package]
name = "fwf"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# Pinned to 0.53: the row-group and string-slicing behaviour the README documents
# was verified against this version's source. Re-check those notes before moving.
polars = { version = "0.53", default-features = false, features = ["parquet"] }
serde_json = "1.0.151"
zip = "8.6.0"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
polars = { version = "0.53", default-features = false, features = ["parquet"] }
tempfile = "3.27.0"
zip = "8.6.0"
